## ============================================================
##  mpv.conf — config polie + optimisée qualité vidéo
##  Profil cible : GPU mid-range (GTX 1660 / RX 6600 class),
##                 streaming bas débit (YouTube/Twitch),
##                 écran HDR
##  Compatible avec ModernZ + thumbfast
## ============================================================

# ---------- Fichiers ----------
autocreate-playlist=same
save-position-on-quit=yes
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# ---------- Fenêtre ----------
border=yes
cursor-autohide=2000
fullscreen=no
autofit-larger=80%
autofit-smaller=35%
keep-open=no
force-seekable=yes
window-corners=round
geometry=-+40-+40
hidpi-window-scale=yes

# ---------- Contrôles ----------
media-controls=yes

# ---------- OSD / OSC ----------
osc=no
osd-level=1
osd-bar=no
osd-font='Noto Sans'
osd-font-size=24

# ============================================================
#  VIDÉO — backend & qualité
# ============================================================
profile=high-quality                     # ewa_lanczossharp, deband basique, etc.
vo=gpu-next                              # backend moderne (HDR, meilleures perfs)
gpu-api=auto                             # laisse mpv choisir (D3D11 sur Windows)

# Décodage matériel : économise CPU sans perte visible sur streaming
hwdec=auto-safe
hwdec-codecs=all

# Dithering (anti-banding sur écrans 8 bits)
dither-depth=auto
temporal-dither=yes

# Interpolation : lecture fluide (judder gone)
video-sync=display-resample
interpolation=yes
tscale=oversample

# Désactive l'upscaling linéaire (préserve la netteté)
linear-downscaling=no

# ============================================================
#  HDR — passthrough vers ton écran HDR
# ============================================================
target-colorspace-hint=yes               # passe le HDR à ton écran HDR (gpu-next)
target-peak=auto                         # auto-détection peak nits du display
tone-mapping=bt.2446a                    # algo moderne (Bluray UHD HDR -> écran SDR si besoin)
gamut-mapping-mode=perceptual
hdr-compute-peak=yes                     # ajuste dynamiquement aux scènes

# ============================================================
#  DEBAND — tueur de bandes pour streaming bas débit (YouTube/Twitch)
# ============================================================
deband=yes
deband-iterations=4                      # plus = mieux (4 = excellent compromis)
deband-threshold=48                      # plus haut = plus agressif
deband-range=16
deband-grain=24                          # grain léger pour masquer le résidu

# ============================================================
#  SHADERS — chroma + sharpen léger
#  (placés dans <mpv config>/shaders/)
# ============================================================
glsl-shaders="~~/shaders/KrigBilateral.glsl"          # chroma upscaling, presque gratuit
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"  # downscale 4K -> 1440p/1080p plus net
glsl-shaders-append="~~/shaders/CAS.glsl"             # AMD Contrast Adaptive Sharpening, très léger

# Pour activer/désactiver à la volée pendant la lecture, voir input.conf (raccourcis ci-dessous)

# ---------- Audio ----------
volume=80
volume-max=150
alang=fr,fre,fra,en,eng
audio-pitch-correction=yes

# ---------- Sous-titres ----------
slang=fr,fre,fra,en,eng
sub-auto=fuzzy
sub-color=1.0/1.0/1.0/1.0
sub-border-color=0/0/0/0.95
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color=0/0/0/0.6
sub-blur=0.2
sub-font='Noto Sans'
sub-font-size=42
sub-margin-y=40
sub-ass-override=force
sub-ass-style-overrides=Default,FontName=Noto Sans

# ============================================================
#  yt-dlp — YouTube qualité maximale (AV1 prioritaire)
# ============================================================
# AV1 d'abord (meilleure qualité à bitrate égal), fallback VP9 puis H.264
ytdl-format=bv*[vcodec~='^(av01)'][height<=2160]+ba/bv*[vcodec~='^(vp9)'][height<=2160]+ba/bv*[height<=2160]+ba/best
ytdl-raw-options=sub-lang="fr,en",write-auto-sub=

# ---------- Captures d'écran ----------
screenshot-sw=yes
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=1
screenshot-jpeg-quality=95
screenshot-dir="~~desktop/"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# ============================================================
#  Cache réseau — augmenté pour streaming + chunked HLS
# ============================================================
cache=yes
cache-secs=120
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=200MiB

# ============================================================
#  PROFILS dynamiques — adaptation auto au contenu
# ============================================================

# Vidéo HDR détectée : laisse gpu-next gérer en passthrough natif
[hdr-display]
profile-cond=p["video-params/primaries"] == "bt.2020" or p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-peak=auto
tone-mapping=auto

# Source >= 1440p : moins de deband (préserve les détails fins)
[high-res]
profile-cond=(p["video-params/h"] or 0) >= 1440
profile-restore=copy
deband-iterations=2

# Source < 720p (DVD, anciens YouTube 360p) : pousse le deband
[low-res]
profile-cond=(p["video-params/h"] or 0) < 720
profile-restore=copy
deband-iterations=4
deband-threshold=64
