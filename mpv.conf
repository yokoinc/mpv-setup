## ============================================================
##  mpv.conf - polished config tuned for video quality
##  Target profile: mid-range GPU (GTX 1660 / RX 6600 class),
##                  low-bitrate streaming (YouTube/Twitch),
##                  HDR display
##  Works with ModernZ + thumbfast
## ============================================================

# ---------- Files ----------
autocreate-playlist=same
save-position-on-quit=yes
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# ---------- Window ----------
border=yes
cursor-autohide=2000
fullscreen=no
autofit-larger=80%
autofit-smaller=35%
keep-open=no
force-seekable=yes
window-corners=round
geometry=-+40-+40
hidpi-window-scale=yes

# ---------- Controls ----------
media-controls=yes

# ---------- OSD / OSC ----------
osc=no
osd-level=1
osd-bar=no
osd-font='Noto Sans'
osd-font-size=24

# ============================================================
#  VIDEO - backend & quality
# ============================================================
profile=high-quality                     # ewa_lanczossharp, basic deband, etc.
vo=gpu-next                              # modern backend (HDR, better performance)
gpu-api=auto                             # let mpv pick (D3D11 on Windows)

# Hardware decoding: saves CPU with no visible loss on streams
hwdec=auto-safe
hwdec-codecs=all

# Dithering (anti-banding on 8-bit displays)
dither-depth=auto
temporal-dither=yes

# Interpolation: smooth playback (judder gone)
video-sync=display-resample
interpolation=yes
tscale=oversample

# Disable linear downscaling (keeps the image sharp)
linear-downscaling=no

# ============================================================
#  HDR - passthrough to your HDR display
# ============================================================
target-colorspace-hint=yes               # send HDR to your HDR display (gpu-next)
target-peak=auto                         # auto-detect the display peak nits
tone-mapping=bt.2446a                    # modern algorithm (UHD Blu-ray HDR -> SDR display when needed)
gamut-mapping-mode=perceptual
hdr-compute-peak=yes                     # adjusts dynamically, scene by scene

# ============================================================
#  DEBAND - banding killer for low-bitrate streams (YouTube/Twitch)
# ============================================================
deband=yes
deband-iterations=4                      # more = better (4 = great trade-off)
deband-threshold=48                      # higher = more aggressive
deband-range=16
deband-grain=24                          # light grain to hide the leftovers

# ============================================================
#  SHADERS - neural upscaling + chroma + sharpen
#  (kept in <mpv config>/shaders/)
#  Order: luma (FSRCNNX) -> chroma (Krig) -> downscale -> sharpen
# ============================================================
glsl-shaders="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"    # neural luma upscaling (720p/1080p -> big screen), heavy but excellent
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"   # chroma upscaling, almost free
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"  # sharper 4K -> 1440p/1080p downscale
glsl-shaders-append="~~/shaders/CAS.glsl"             # AMD Contrast Adaptive Sharpening, very light

# To toggle them during playback, see input.conf (bindings below)

# ---------- Audio ----------
volume=80
volume-max=150
alang=fr,fre,fra,en,eng
audio-pitch-correction=yes

# ---------- Subtitles ----------
slang=fr,fre,fra,en,eng
sub-auto=fuzzy
sub-color=1.0/1.0/1.0/1.0
sub-border-color=0/0/0/0.95
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color=0/0/0/0.6
sub-blur=0.2
sub-font='Noto Sans'
sub-font-size=42
sub-margin-y=40
sub-ass-override=force
sub-ass-style-overrides=Default,FontName=Noto Sans

# ============================================================
#  yt-dlp - maximum YouTube quality (AV1 first)
# ============================================================
# AV1 first (best quality at the same bitrate), then VP9, then H.264
ytdl-format=bv*[vcodec~='^(av01)'][height<=2160]+ba/bv*[vcodec~='^(vp9)'][height<=2160]+ba/bv*[height<=2160]+ba/best
ytdl-raw-options=sub-lang="fr,en",write-auto-sub=

# ---------- Screenshots ----------
screenshot-sw=yes
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=1
screenshot-jpeg-quality=95
screenshot-dir="~~desktop/"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# ============================================================
#  Network cache - raised for streaming + chunked HLS
# ============================================================
cache=yes
cache-secs=120
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=200MiB

# ============================================================
#  Dynamic PROFILES - auto adaptation to the content
# ============================================================

# HDR video detected: let gpu-next handle native passthrough
[hdr-display]
profile-cond=p["video-params/primaries"] == "bt.2020" or p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-peak=auto
tone-mapping=auto

# Source >= 1440p: less deband (keeps fine detail)
[high-res]
profile-cond=(p["video-params/h"] or 0) >= 1440
profile-restore=copy
deband-iterations=2

# Source < 720p (DVD, old 360p YouTube): push deband harder
[low-res]
profile-cond=(p["video-params/h"] or 0) < 720
profile-restore=copy
deband-iterations=4
deband-threshold=64
