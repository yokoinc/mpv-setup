# ============================================================
#  ModernZ - custom config
#  Put this in: <mpv config>/script-opts/modernz.conf
#  Full docs: https://github.com/Samillion/ModernZ
#
#  NOTE: mpv does NOT accept end-of-line comments in
#  script-opts files. Always put comments on their own
#  line starting with #.
# ============================================================

# ----- Layout & theme -----
# interface language; set "fr" (or any key of modernz-locale.json)
# for a translated interface
language=en
# "modern" (rich) or "modern-compact" (minimal)
layout=modern
# "fluent" (Microsoft) or "material" (Google)
icon_theme=fluent
# "mixed", "filled" or "outline"
icon_style=mixed

# ----- Behaviour -----
hidetimeout=1500
fadeduration=250
fadein=yes
keep_with_cursor=yes
# bottom area that wakes the OSC up when the mouse moves in it
deadzonesize=0.5
deadzone_hide=instant
osc_on_seek=yes
osc_on_start=both
showonpause=yes
# keeps the OSC visible on pause + hover top/bottom
keeponpause=both
mouse_seek_pause=yes
window_top_bar=auto
showwindowed=yes
showfullscreen=yes

# ----- Scale -----
vidscale=auto
scalewindowed=1.0
scalefullscreen=1.0

# ----- Title & info -----
show_title=yes
title=${media-title}
title_font_size=22
chapter_title_font_size=15
show_chapter_title=yes
chapter_above_title=no

# ----- Time -----
timecurrent=yes
timems=no
time_format=dynamic
time_font_size=15
tooltip_font_size=13
speed_font_size=15

# ----- Buttons: what is shown -----
subtitles_button=yes
audio_tracks_button=yes
jump_buttons=yes
jump_amount=10
jump_more_amount=60
jump_icon_number=yes
jump_mode=relative
jump_softrepeat=yes
# on: handy for movies with chapters
chapter_skip_buttons=yes
track_nextprev_buttons=yes
volume_control=yes
volume_control_type=logarithmic
volumebar_unmute_on_click=yes
playlist_button=yes
hide_empty_playlist_button=no
gray_empty_playlist_button=yes
# web video download (needs yt-dlp + ffmpeg)
download_button=yes
download_path=~~desktop/mpv
screenshot_button=yes
ontop_button=yes
loop_button=yes
shuffle_button=no
speed_button=yes
info_button=yes
fullscreen_button=yes

# ----- Icon sizes -----
playpause_size=30
midbuttons_size=22
sidebuttons_size=22

# ============================================================
#  Colors: dark theme + warm orange accent (same as the
#  ModernZ defaults). Change the accent below to taste.
#  A few ready-made palettes:
#    - Orange (default) : #FF8232 / handle #C96508
#    - Material Blue    : #3B82F6 / handle #1D4ED8
#    - Purple           : #A855F7 / handle #7E22CE
#    - Emerald Green    : #10B981 / handle #047857
#    - Netflix Red      : #E50914 / handle #B0060F
# ============================================================

# OSC background
osc_color=#000000
window_title_color=#FFFFFF
window_controls_color=#FFFFFF
windowcontrols_close_hover=#F45C5B
windowcontrols_max_hover=#F8BC3A
windowcontrols_min_hover=#43CB44

# Text
title_color=#FFFFFF
cache_info_color=#FFFFFF
time_color=#FFFFFF
chapter_title_color=#FFFFFF

# Seekbar (accent color)
seekbarfg_color=#FF8232
seekbarbg_color=#666666
seekbar_cache_color=#B1B1B1
seek_handle_color=#FF8232
seek_handle_border_color=#FFFFFF
volumebar_match_seek_color=yes

# Buttons
side_buttons_color=#FFFFFF
middle_buttons_color=#FFFFFF
playpause_color=#FFFFFF
held_element_color=#FF8232
hover_effect_color=#FF8232

# Thumbnails (thumbfast)
thumbnail_box_color=#0E0E0E
thumbnail_box_outline=#FF8232
thumbnail_box_padding=4
thumbnail_box_radius=6
thumbnail_box_outline_size=1

# Chapter marks on the seekbar
nibble_color=#FF8232
nibble_current_color=#FFFFFF

# ----- Visual effects -----
# 0 = no dark band behind the OSC
osc_fade_strength=85
# band blur (heavy above 100)
fade_blur_strength=80
window_fade_strength=85
window_fade_blur_strength=80
hover_effect=size,glow,color
button_hover_size=115
button_held_size=98
