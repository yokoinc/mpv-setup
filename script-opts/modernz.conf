# ============================================================
#  ModernZ — config personnalisée
#  À placer dans: <mpv config>/script-opts/modernz.conf
#  Doc complète : https://github.com/Samillion/ModernZ
# ============================================================

# ----- Mise en page & thème -----
language=fr
layout=modern              # "modern" (riche) ou "modern-compact" (épuré)
icon_theme=fluent          # "fluent" (Microsoft) ou "material" (Google)
icon_style=mixed           # "mixed", "filled" ou "outline"

# ----- Comportement -----
hidetimeout=1500
fadeduration=250
fadein=yes
keep_with_cursor=yes
deadzonesize=0.5           # zone basse qui réveille l'OSC quand la souris bouge dedans
deadzone_hide=instant
osc_on_seek=yes
osc_on_start=both
showonpause=yes
keeponpause=both           # garde l'OSC visible quand pause + survol haut/bas
mouse_seek_pause=yes
window_top_bar=auto
showwindowed=yes
showfullscreen=yes

# ----- Échelle -----
vidscale=auto
scalewindowed=1.0
scalefullscreen=1.0

# ----- Titre & infos -----
show_title=yes
title=${media-title}
title_font_size=22
chapter_title_font_size=15
show_chapter_title=yes
chapter_above_title=no

# ----- Temps -----
timecurrent=yes
timems=no
time_format=dynamic
time_font_size=15
tooltip_font_size=13
speed_font_size=15

# ----- Boutons : ce qu'on affiche -----
subtitles_button=yes
audio_tracks_button=yes
jump_buttons=yes
jump_amount=10
jump_more_amount=60
jump_icon_number=yes
jump_mode=relative
jump_softrepeat=yes
chapter_skip_buttons=yes   # << activé : utile sur films à chapitres
track_nextprev_buttons=yes
volume_control=yes
volume_control_type=logarithmic
volumebar_unmute_on_click=yes
playlist_button=yes
hide_empty_playlist_button=no
gray_empty_playlist_button=yes
download_button=yes        # téléchargement vidéos web (yt-dlp + ffmpeg requis)
download_path=~~desktop/mpv
screenshot_button=yes
ontop_button=yes
loop_button=yes
shuffle_button=no
speed_button=yes
info_button=yes
fullscreen_button=yes

# ----- Tailles d'icônes -----
playpause_size=30
midbuttons_size=22
sidebuttons_size=22

# ============================================================
#  Couleurs : thème sombre + accent orange chaud (cohérent avec
#  les valeurs par défaut de ModernZ). Change l'accent ci-dessous
#  pour personnaliser. Quelques palettes prêtes à l'emploi :
#    - Orange (défaut)  : #FF8232 / handle #C96508
#    - Bleu Material    : #3B82F6 / handle #1D4ED8
#    - Violet           : #A855F7 / handle #7E22CE
#    - Vert Emeraude    : #10B981 / handle #047857
#    - Rouge Netflix    : #E50914 / handle #B0060F
# ============================================================

# Fond OSC
osc_color=#000000
window_title_color=#FFFFFF
window_controls_color=#FFFFFF
windowcontrols_close_hover=#F45C5B
windowcontrols_max_hover=#F8BC3A
windowcontrols_min_hover=#43CB44

# Texte
title_color=#FFFFFF
cache_info_color=#FFFFFF
time_color=#FFFFFF
chapter_title_color=#FFFFFF

# Seekbar (couleur d'accent)
seekbarfg_color=#FF8232
seekbarbg_color=#666666
seekbar_cache_color=#B1B1B1
seek_handle_color=#FF8232
seek_handle_border_color=#FFFFFF
volumebar_match_seek_color=yes

# Boutons
side_buttons_color=#FFFFFF
middle_buttons_color=#FFFFFF
playpause_color=#FFFFFF
held_element_color=#FF8232
hover_effect_color=#FF8232

# Miniatures (thumbfast)
thumbnail_box_color=#0E0E0E
thumbnail_box_outline=#FF8232
thumbnail_box_padding=4
thumbnail_box_radius=6
thumbnail_box_outline_size=1

# Chapitres sur la seekbar
nibble_color=#FF8232
nibble_current_color=#FFFFFF

# ----- Effets visuels -----
osc_fade_strength=85           # 0 = pas de bandeau noir derrière l'OSC
fade_blur_strength=80          # flou du bandeau (lourd au-delà de 100)
window_fade_strength=85
window_fade_blur_strength=80
hover_effect=size,glow,color
button_hover_size=115
button_held_size=98
