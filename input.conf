# ============================================================
#  input.conf - custom key bindings
#  Docs: https://mpv.io/manual/master/#input-conf
#
#  The default mpv bindings stay active unless you redefine
#  them here (Space pause, f fullscreen, m mute, etc.)
# ============================================================

# --- Delete the file being played ---
# DEL        : move to the Recycle Bin (recoverable)
# Shift+DEL  : delete permanently
DEL         script-message delete-current recycle
Shift+DEL   script-message delete-current permanent
